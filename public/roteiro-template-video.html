<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteiro</title>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family: Arial, Helvetica, sans-serif; background:#f4f4f4; padding:40px; color:#222; }
    .container{ max-width:1400px; margin:0 auto; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.08); }
    .header{ background:#c10230; color:#fff; padding:32px; }
    .header-title{ font-size:30px; font-weight:bold; margin-bottom:30px; }
    .header-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; }
    .header-item{ min-height:60px; }
    .header-label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:0.75; margin-bottom:8px; }
    .header-value{ font-size:16px; font-weight:700; line-height:1.5; }
    .table-wrapper{ padding:30px; }
    table{ width:100%; border-collapse:collapse; }
    th{ background:#c10230; color:#fff; text-align:left; padding:16px; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; }
    td{ padding:18px 16px; border-bottom:1px solid #ececec; vertical-align:top; height:90px; }
    tr:nth-child(even){ background:#fafafa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">ROTEIROS</div>
      <div class="header-grid">
        <div class="header-item">
          <div class="header-label">Campanha</div>
          <div class="header-value">CLIENTE: Estúdio</div>
        </div>
        <div class="header-item">
          <div class="header-label">Nome do Arquivo</div>
          <div class="header-value">[Redes sociais]_Estúdio_NomeDoRoteiro_VH</div>
        </div>
        <div class="header-item">
          <div class="header-label">Observação</div>
          <div class="header-value">Vertical e horizontal</div>
        </div>
        <div class="header-item">
          <div class="header-label">Referência</div>
          <div class="header-value">Descrição do tema do roteiro</div>
        </div>
        <div class="header-item">
          <div class="header-label">Produtora</div>
          <div class="header-value">BONIARTE</div>
        </div>
        <div class="header-item">
          <div class="header-label">Apresentação</div>
          <div class="header-value">Professor(a) / Porta voz Pure Pilates</div>
        </div>
        <div class="header-item">
          <div class="header-label">Direção</div>
          <div class="header-value">ANDRÉ ÂNGELO</div>
        </div>
      </div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Cena</th>
            <th>Narração</th>
          </tr>
        </thead>
        <tbody>
          <tr><td></td><td></td></tr>
          <tr><td></td><td></td></tr>
          <tr><td></td><td></td></tr>
          <tr><td></td><td></td></tr>
          <tr><td></td><td></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
